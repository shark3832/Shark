<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHARK SCRIPT</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 75%, rgba(255,220,80,.55), transparent 32%),
        radial-gradient(ellipse at 15% 20%, rgba(255,255,255,.35), transparent 35%),
        linear-gradient(135deg, #b7d69b 0%, #8fcb78 48%, #c8e8a8 100%);
      color: #222;
    }
    .telegram-label {
      position: fixed;
      top: 22px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #263238;
      font-size: 15px;
      font-weight: 700;
      direction: ltr;
    }
    .telegram-label .plane {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #229ed9;
      color: white;
      font-size: 13px;
    }
    .subscribe {
      position: fixed;
      top: 18px;
      right: 22px;
      border: 0;
      border-radius: 22px;
      background: #229ed9;
      color: white;
      padding: 10px 20px;
      font-weight: bold;
      letter-spacing: .3px;
    }
    .card {
      width: min(100%, 330px);
      text-align: center;
      padding: 26px 23px 24px;
      border-radius: 16px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 12px 35px rgba(35, 65, 25, .12);
      backdrop-filter: blur(9px);
    }
    .avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto 17px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: white;
      font-size: 29px;
      font-weight: 800;
      background: linear-gradient(140deg, #232a36, #df6b4c 52%, #151a22);
      border: 3px solid rgba(255,255,255,.9);
    }
    h1 {
      margin: 0 0 5px;
      font-size: 19px;
      line-height: 1.5;
      direction: ltr;
    }
    .arabic-name { font-size: 15px; font-weight: 700; margin-bottom: 9px; }
    .members { color: #888; font-size: 13px; margin-bottom: 15px; }
    .description {
      color: #555;
      font-size: 12px;
      line-height: 1.9;
      margin: 0 0 19px;
    }
    .join {
      display: inline-block;
      text-decoration: none;
      border-radius: 24px;
      padding: 13px 22px;
      background: #229ed9;
      color: white;
      font-size: 12px;
      font-weight: 800;
      direction: ltr;
      transition: transform .2s, background .2s;
    }
    .join:hover { background: #168ac2; transform: translateY(-2px); }
    @media (max-width: 480px) {
      .telegram-label { top: 16px; left: 15px; }
      .subscribe { top: 13px; right: 12px; padding: 9px 14px; font-size: 11px; }
      .card { margin-top: 30px; }
    }
  
   </style>

</head>
<body>
  <div class="telegram-label"><span class="plane">➤</span><span>Telegram</span></div>
  <button class="subscribe" onclick="openTelegram()">SUBSCRIBE</button>

  <main class="card">
    <img class="avatar" src="https://imglink.cc/cdn/LZNc0yyH0u.jpg" alt="صورة القناة">
    <h1>SHARK SKRBT</h1>
    <div class="arabic-name">SHARK SCRIPT</div>
    <div class="members">30000 members</div>
    <p class="description">
      أهلاً بيكم في قناة SHARK SCRIPT✨<br>
    للحصول علي اسكربت الطيارة اضغط هنا.<br>
      نتمنى لكم تجربة ممتعة، وأهلاً بكل الأعضاء الجدد ❤️
    </p>
    
<a href="https://t.me/ar_FtHo"
   target="_blank"
   class="join">
  VIEW IN TELEGRAM
</a>

  </main>

  <script>
    // غيّر الرابط هنا إلى رابط قناتك، مثال: https://t.me/YourChannel
    const telegramLink = "https://t.me/ar_FtHo";
    document.querySelector(".join").href = telegramLink;
    function openTelegram() { window.open(telegramLink, "_blank", "noopener"); }
  </script>
</body>
</html>
